name: Drago Evolution Update

on:
  schedule:
    # Runs every 15 minutes to evaluate latest contributions, streaks, and evolution
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      username:
        description: "GitHub username to evaluate (leave blank for repository owner)"
        required: false
        default: ""
      force_stage:
        description: "Force specific evolution stage (1-13, leave blank for auto)"
        required: false
        default: ""
  repository_dispatch:
    types: [drago-update]

permissions:
  contents: write

jobs:
  evolve:
    name: Evolve Dragon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy

      - name: Update Dragon Evolution & Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${{ github.event.inputs.force_stage }}" ]; then
            TARGET_USER="${{ github.event.inputs.username || github.repository_owner }}"
            python -m drago.cli render --stage "${{ github.event.inputs.force_stage }}" --username "$TARGET_USER" --output assets/dragon.gif
          elif [ -n "${{ github.event.inputs.username }}" ]; then
            python -m drago.cli update --username "${{ github.event.inputs.username }}" --token "$GITHUB_TOKEN"
          else
            # Central Hub mode: update all registered users automatically
            python -m drago.cli update-all --token "$GITHUB_TOKEN"
          fi

      - name: Deploy Assets to Orphan gh-pages Branch (0 MB History Bloat)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/deploy_assets.py

