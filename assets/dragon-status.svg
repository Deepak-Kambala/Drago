<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="650" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B700" />
      <stop offset="100%" stop-color="#FFD13B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="648" height="178" rx="12" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.5" />

  <!-- Top Accent Bar -->
  <rect x="1" y="1" width="648" height="3" rx="1.5" fill="#F5B700" />

  <!-- Stage Badge & Title -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="76" height="22" rx="4" fill="#F5B700" fill-opacity="0.15" stroke="#F5B700" stroke-width="1" />
    <text x="38" y="15" fill="#F5B700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">LVL 2</text>
    
    <text x="88" y="17" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">HATCHLING</text>
    <text x="88" y="36" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">Freshly Hatched Drake</text>
  </g>

  <!-- Progress Bar & Score -->
  <g transform="translate(340, 28)">
    <text x="0" y="14" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Evolution Power: <tspan fill="#F5B700">44.5</tspan></text>
    <text x="280" y="14" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">86%</text>
    
    <!-- Track -->
    <rect x="0" y="22" width="280" height="8" rx="4" fill="#21262D" />
    <!-- Filled Bar -->
    <rect x="0" y="22" width="242" height="8" rx="4" fill="url(#barGrad)" filter="url(#glow)" />
    
    <text x="0" y="44" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10">Next: Youngling (50 XP)</text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="84" x2="626" y2="84" stroke="#21262D" stroke-width="1" />

  <!-- Traits & Activity Metrics (2-column layout) -->
  <g transform="translate(24, 102)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Unlocked Traits Column -->
    <text x="0" y="12" fill="#8B949E" font-size="10" font-weight="700" letter-spacing="1">ANATOMICAL TRAITS</text>
    <text x="0" y="32" fill="#C9D1D9" font-size="12">Horns: <tspan fill="#F5B700">Tier 1</tspan> • Wings: <tspan fill="#F5B700">Tier 2</tspan></text>
    <text x="0" y="52" fill="#C9D1D9" font-size="12">Spikes: <tspan fill="#F5B700">0</tspan> • Armor: <tspan fill="#F5B700">Tier 0</tspan> • Streak Aura: <tspan fill="#F5B700">Active (20%)</tspan></text>

    <!-- Activity Stats Column -->
    <text x="340" y="12" fill="#8B949E" font-size="10" font-weight="700" letter-spacing="1">GITHUB ACTIVITY</text>
    <text x="340" y="32" fill="#C9D1D9" font-size="12">Commits: <tspan fill="#F0F6FC" font-weight="600">100</tspan> • PRs: <tspan fill="#F0F6FC" font-weight="600">0</tspan> (Merged: <tspan fill="#F0F6FC" font-weight="600">0</tspan>)</text>
    <text x="340" y="52" fill="#C9D1D9" font-size="12">Repos: <tspan fill="#F0F6FC" font-weight="600">5</tspan> • Stars: <tspan fill="#F0F6FC" font-weight="600">10</tspan> • Streak: <tspan fill="#F5B700" font-weight="600">3d 🔥</tspan></text>
  </g>
</svg>