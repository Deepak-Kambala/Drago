<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 110" width="650" height="110">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B700" />
      <stop offset="100%" stop-color="#FFD13B" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="648" height="108" rx="10" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1" />
  <rect x="1" y="1" width="648" height="2.5" rx="1" fill="#F5B700" />

  <!-- Top Line: Stage Badge, Stage Name, User & XP -->
  <g transform="translate(24, 28)">
    <!-- Level Badge -->
    <rect x="0" y="0" width="54" height="20" rx="4" fill="#F5B700" fill-opacity="0.15" stroke="#F5B700" stroke-width="1" />
    <text x="27" y="14" fill="#F5B700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">LVL 5</text>

    <!-- Stage Name & Dynamic Username -->
    <text x="64" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <tspan fill="#F0F6FC" font-size="15" font-weight="700" letter-spacing="0.3">ADOLESCENT</tspan>
      <tspan dx="10" fill="#8B949E" font-size="12" font-weight="500">@Deepak-Kambala</tspan>
    </text>

    <!-- XP & Percentage -->
    <text x="602" y="15" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end">
      <tspan fill="#F5B700">304.0</tspan> XP <tspan fill="#8B949E" font-weight="400">(2%)</tspan>
    </text>
  </g>

  <!-- Full-Width Sleek Progress Bar -->
  <g transform="translate(24, 48)">
    <rect x="0" y="0" width="602" height="6" rx="3" fill="#21262D" />
    <rect x="0" y="0" width="12" height="6" rx="3" fill="url(#barGrad)" filter="url(#glow)" />
  </g>

  <!-- Bottom Useful Metrics Row -->
  <g transform="translate(24, 82)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Streak -->
    <text x="0" y="0" fill="#8B949E" font-size="10" font-weight="600" letter-spacing="0.5">STREAK</text>
    <text x="0" y="16" fill="#F0F6FC" font-size="13" font-weight="700">🔥 3 days</text>

    <!-- Evolution Power -->
    <text x="140" y="0" fill="#8B949E" font-size="10" font-weight="600" letter-spacing="0.5">EVOLUTION POWER</text>
    <text x="140" y="16" fill="#F5B700" font-size="13" font-weight="700">⚡ 304.0</text>

    <!-- Commits -->
    <text x="290" y="0" fill="#8B949E" font-size="10" font-weight="600" letter-spacing="0.5">COMMITS</text>
    <text x="290" y="16" fill="#F0F6FC" font-size="13" font-weight="700">💻 120</text>

    <!-- Pull Requests -->
    <text x="430" y="0" fill="#8B949E" font-size="10" font-weight="600" letter-spacing="0.5">PULL REQUESTS</text>
    <text x="430" y="16" fill="#F0F6FC" font-size="13" font-weight="700">🔀 19</text>

    <!-- Next Unlock -->
    <text x="602" y="16" fill="#8B949E" font-size="10" font-weight="500" text-anchor="end">Next: Adult (500 XP)</text>
  </g>
</svg>